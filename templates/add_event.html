<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить мероприятие</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="form-container">
        <h1>Добавить мероприятие</h1>

        {% if get_flashed_messages() %}
            <div class="flash-messages">
                {% for category, message in get_flashed_messages(with_categories=true) %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="title">Название *</label>
                <input type="text" id="title" name="title" required placeholder="Введите название мероприятия">
            </div>

            <div class="form-group">
                <label for="event_date">Дата *</label>
                <input type="date" id="event_date" name="event_date" required>
            </div>

            <div class="form-group">
                <label for="event_time">Время</label>
                <input type="time" id="event_time" name="event_time" placeholder="ЧЧ:ММ">
            </div>

            <div class="form-group">
                <label for="location">Место проведения</label>
                <input type="text" id="location" name="location" placeholder="Где будет мероприятие?">
            </div>

            <div class="form-group">
                <label for="description">Описание</label>
                <textarea id="description" name="description" placeholder="Подробности мероприятия"></textarea>
            </div>

            <button type="submit" class="btn-submit">Сохранить</button>
        </form>

        <a href="{{ url_for('index') }}" class="btn-back">← Назад к календарю</a>
    </div>
</body>
</html>
